name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Arquivos privados e padrões de credenciais
        run: python scripts/check_public_files.py
      - name: Dependências do servidor
        run: python -m pip install -r requirements.txt
      - name: Confirmação de conversa e prioridade da resposta
        run: python -m unittest discover -s tests -v
      - name: Sintaxe Python
        run: python -m compileall -q server scripts
      - name: Sintaxe shell
        run: |
          bash -n tablet/build.sh
          for script in tablet/setup/*.sh; do sh -n "$script"; done
      - name: Sintaxe JavaScript
        run: |
          for script in web/*.js; do node --check "$script"; done
      - name: Configuração de exemplo
        run: python -m json.tool server/config.example.json > /dev/null
